name: Build and Release to storyforgeapp

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag like v1.0.0
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g., v1.0.0) if running manually'
        required: true
        default: 'v1.0.0'

jobs:
  # 1. Build Windows (.exe) and macOS (StoryForge.dmg)
  build-win-mac:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PyQt6 python-docx lxml fonttools pillow pyspellchecker

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --name StoryForge `
            --icon storyforge_transparent.ico `
            --add-data "database.py;." `
            --add-data "docx_export.py;." `
            --add-data "font_studio.py;." `
            --add-data "storage_client.py;." `
            --hidden-import sqlite3 `
            --hidden-import docx `
            --hidden-import lxml `
            --hidden-import fontTools `
            --hidden-import PIL `
            --hidden-import spellchecker `
            --hidden-import PyQt6 `
            storyforge.py

      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iss = @'
          [Setup]
          AppName=StoryForge
          AppVersion=1.0.0
          DefaultDirName={autopf}\StoryForge
          DefaultGroupName=StoryForge
          OutputDir=dist\installer
          OutputBaseFilename=StoryForge-Setup-Windows
          SetupIconFile=storyforge_transparent.ico
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64

          [Files]
          Source: "dist\StoryForge.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\StoryForge"; Filename: "{app}\StoryForge.exe"
          Name: "{autodesktop}\StoryForge"; Filename: "{app}\StoryForge.exe"
          '@
          Set-Content -Path installer.iss -Value $iss -Encoding UTF8
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }

      - name: Upload Windows Installer to storyforgeapp Release
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          repository: sut0005-cpu/storyforgeapp
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          files: dist/installer/StoryForge-Setup-Windows.exe

      - name: Build on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed --name StoryForge \
            --add-data "database.py:." \
            --add-data "docx_export.py:." \
            --add-data "font_studio.py:." \
            --add-data "storage_client.py:." \
            --hidden-import sqlite3 \
            --hidden-import docx \
            --hidden-import lxml \
            --hidden-import fontTools \
            --hidden-import PIL \
            --hidden-import spellchecker \
            --hidden-import PyQt6 \
            storyforge.py

      - name: Create macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil create \
            -volname StoryForge \
            -srcfolder dist/StoryForge.app \
            -ov \
            -format UDZO \
            dist/StoryForge.dmg

      - name: Upload macOS Installer to storyforgeapp Release
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          repository: sut0005-cpu/storyforgeapp
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          files: dist/StoryForge.dmg

  # 2. Build Linux Flatpak (StoryForge.flatpak)
  build-flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Flatpak Installer Bundle
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org
          dbus-run-session -- flatpak-builder --force-clean --disable-rofiles-fuse --install-deps-from=flathub --repo=repo build-dir storyforge.yml
          flatpak build-bundle repo StoryForge.flatpak io.github.sut0005_cpu.storyforge

      - name: Upload Flatpak to storyforgeapp Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          repository: sut0005-cpu/storyforgeapp
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          files: StoryForge.flatpak

