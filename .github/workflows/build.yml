name: Build and Release to storyforgeapp

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-win-mac:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 PyQt6-Qt6 PyQt6-sip
          python -m pip install python-docx lxml fonttools pillow pyspellchecker
          python -m pip install --upgrade pyinstaller pyinstaller-hooks-contrib

      - name: Clean previous builds
        shell: bash
        run: |
          rm -rf build dist
          mkdir -p dist

      - name: Verify PyQt6 installation
        run: |
          python -c "from PyQt6 import QtCore, QtGui, QtWidgets; print('PyQt6 imports successful')"
          python -m PyInstaller --version

      # WINDOWS BUILD
      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name StoryForge `
            --collect-all PyQt6 `
            --collect-all PyQt6.QtGui `
            --collect-all PyQt6.QtWidgets `
            --collect-all PyQt6.QtCore `
            --icon storyforge_transparent.ico `
            --add-data "database.py;." `
            --add-data "docx_export.py;." `
            --add-data "font_studio.py;." `
            --add-data "storage_client.py;." `
            --hidden-import sqlite3 `
            --hidden-import docx `
            --hidden-import lxml `
            --hidden-import fontTools `
            --hidden-import PIL `
            --hidden-import spellchecker `
            --hidden-import PyQt6 `
            --hidden-import PyQt6.QtCore `
            --hidden-import PyQt6.QtGui `
            --hidden-import PyQt6.QtWidgets `
            storyforge.py

          if ($LASTEXITCODE -ne 0) {
            throw 'Windows PyInstaller build failed.'
          }

      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

          $iss = @'
          [Setup]
          AppName=StoryForge
          AppVersion=1.0.0
          DefaultDirName={autopf}\StoryForge
          DefaultGroupName=StoryForge
          OutputDir=dist\installer
          OutputBaseFilename=StoryForge-Setup-Windows
          SetupIconFile=storyforge_transparent.ico
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64

          [Files]
          Source: "dist\StoryForge.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\StoryForge"; Filename: "{app}\StoryForge.exe"
          Name: "{autodesktop}\StoryForge"; Filename: "{app}\StoryForge.exe"
          '@

          Set-Content -Path installer.iss -Value $iss -Encoding UTF8

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc installer.iss

          if ($LASTEXITCODE -ne 0) {
            throw 'Inno Setup failed.'
          }

      - name: Upload Windows Installer
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          repository: sut0005-cpu/storyforgeapp
          tag_name: installer
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/installer/StoryForge-Setup-Windows.exe

      # MACOS BUILD
      - name: Build StoryForge macOS app
        if: runner.os == 'macOS'
        shell: bash
        env:
          QT_API: pyqt6
        run: |
          python -m PyInstaller \
            --clean \
            --noconfirm \
            --windowed \
            --name StoryForge \
            --add-data "database.py:." \
            --add-data "docx_export.py:." \
            --add-data "font_studio.py:." \
            --add-data "storage_client.py:." \
            --hidden-import sqlite3 \
            --hidden-import docx \
            --hidden-import lxml \
            --hidden-import fontTools \
            --hidden-import PIL \
            --hidden-import spellchecker \
            --hidden-import PyQt6 \
            --hidden-import PyQt6.QtCore \
            --hidden-import PyQt6.QtGui \
            --hidden-import PyQt6.QtWidgets \
            storyforge.py

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ ! -d "dist/StoryForge.app" ]; then
            echo "ERROR: PyInstaller did not create dist/StoryForge.app"
            exit 1
          fi

          hdiutil create \
            -volname "StoryForge" \
            -srcfolder "dist/StoryForge.app" \
            -ov \
            -format UDZO \
            "dist/StoryForge-macOS.dmg"

      - name: Upload macOS Installer
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          repository: sut0005-cpu/storyforgeapp
          tag_name: installer
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/StoryForge-macOS.dmg

  # LINUX FLATPAK
  build-flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Flatpak Installer Bundle
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org
          dbus-run-session -- flatpak-builder --force-clean --disable-rofiles-fuse --install-deps-from=flathub --repo=repo build-dir storyforge.yml
          flatpak build-bundle repo StoryForge.flatpak io.github.sut0005_cpu.storyforge

      - name: Upload Flatpak
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          repository: sut0005-cpu/storyforgeapp
          tag_name: installer
          overwrite_files: true
          fail_on_unmatched_files: true
          files: StoryForge.flatpak
