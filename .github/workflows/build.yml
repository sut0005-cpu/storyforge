name: Build StoryForge installers

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PyQt6 python-docx lxml fonttools pillow pyspellchecker

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --name StoryForge `
            --icon storyforge_transparent.ico `
            --add-data "database.py;." `
            --add-data "docx_export.py;." `
            --add-data "font_studio.py;." `
            --add-data "storage_client.py;." `
            --hidden-import sqlite3 `
            --hidden-import docx `
            --hidden-import lxml `
            --hidden-import fontTools `
            --hidden-import PIL `
            --hidden-import spellchecker `
            --hidden-import PyQt6 `
            storyforge.py

      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iss = @'
          [Setup]
          AppName=StoryForge
          AppVersion=1.0.0
          DefaultDirName={autopf}\StoryForge
          DefaultGroupName=StoryForge
          OutputDir=dist\installer
          OutputBaseFilename=StoryForge-Setup-Windows
          SetupIconFile=storyforge_transparent.ico
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64

          [Files]
          Source: "dist\StoryForge.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\StoryForge"; Filename: "{app}\StoryForge.exe"
          Name: "{autodesktop}\StoryForge"; Filename: "{app}\StoryForge.exe"
          '@
          Set-Content -Path installer.iss -Value $iss -Encoding UTF8
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }

      - name: Build on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed --name StoryForge \
            --add-data "database.py:." \
            --add-data "docx_export.py:." \
            --add-data "font_studio.py:." \
            --add-data "storage_client.py:." \
            --hidden-import sqlite3 \
            --hidden-import docx \
            --hidden-import lxml \
            --hidden-import fontTools \
            --hidden-import PIL \
            --hidden-import spellchecker \
            --hidden-import PyQt6 \
            storyforge.py

      - name: Create macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil create \
            -volname StoryForge \
            -srcfolder dist/StoryForge.app \
            -ov \
            -format UDZO \
            dist/StoryForge-Installer-macOS.dmg

      - name: Build on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed --name StoryForge \
            --add-data "database.py:." \
            --add-data "docx_export.py:." \
            --add-data "font_studio.py:." \
            --add-data "storage_client.py:." \
            --hidden-import sqlite3 \
            --hidden-import docx \
            --hidden-import lxml \
            --hidden-import fontTools \
            --hidden-import PIL \
            --hidden-import spellchecker \
            --hidden-import PyQt6 \
            storyforge.py

      - name: Create Linux Debian installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package_root="dist/deb-root"
          install_dir="$package_root/usr/lib/storyforge"
          mkdir -p "$install_dir" \
            "$package_root/usr/bin" \
            "$package_root/usr/share/applications" \
            "$package_root/DEBIAN" \
            dist/installer

          install -m 755 dist/StoryForge "$install_dir/StoryForge"

          cat > "$package_root/usr/bin/storyforge" <<'EOF'
          #!/bin/sh
          exec /usr/lib/storyforge/StoryForge "$@"
          EOF
          chmod 755 "$package_root/usr/bin/storyforge"

          cat > "$package_root/usr/share/applications/storyforge.desktop" <<'EOF'
          [Desktop Entry]
          Name=StoryForge
          Comment=StoryForge writing application
          Exec=storyforge
          Terminal=false
          Type=Application
          Categories=Office;
          EOF

          cat > "$package_root/DEBIAN/control" <<EOF
          Package: storyforge
          Version: 1.0.0
          Section: office
          Priority: optional
          Architecture: $(dpkg --print-architecture)
          Maintainer: StoryForge
          Description: StoryForge writing application
          EOF

          dpkg-deb --build --root-owner-group \
            "$package_root" \
            dist/installer/StoryForge-Installer-Linux.deb

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: StoryForge-Installer-Windows
          path: dist/installer/StoryForge-Setup-Windows.exe
          if-no-files-found: error

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: StoryForge-Installer-macOS
          path: dist/StoryForge-Installer-macOS.dmg
          if-no-files-found: error

      - name: Upload Linux installer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: StoryForge-Installer-Linux
          path: dist/installer/StoryForge-Installer-Linux.deb
          if-no-files-found: error
