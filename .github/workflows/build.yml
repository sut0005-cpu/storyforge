# MACOS BUILD
- name: Build StoryForge macOS app
  if: runner.os == 'macOS'
  shell: bash
  env:
    QT_API: pyqt6
  run: |
    python -m PyInstaller \
      --clean \
      --noconfirm \
      --windowed \
      --name StoryForge \
      --collect-all PyQt6 \
      --add-data "database.py:." \
      --add-data "docx_export.py:." \
      --add-data "font_studio.py:." \
      --add-data "storage_client.py:." \
      --hidden-import sqlite3 \
      --hidden-import docx \
      --hidden-import lxml \
      --hidden-import fontTools \
      --hidden-import PIL \
      --hidden-import spellchecker \
      --hidden-import PyQt6 \
      --hidden-import PyQt6.QtCore \
      --hidden-import PyQt6.QtGui \
      --hidden-import PyQt6.QtWidgets \
      storyforge.py
      - name: Upload Flatpak
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          repository: sut0005-cpu/storyforgeapp
          tag_name: installer
          overwrite_files: true
          fail_on_unmatched_files: true
          files: StoryForge.flatpak
