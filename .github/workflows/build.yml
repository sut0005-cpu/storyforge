name: Build exe
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: >
          pip install
          pyinstaller
          PyQt6
          PyQt6-Qt6
          PyQt6-sip
          python-docx
          lxml
          fonttools
          pillow
          pyspellchecker

      - name: Build EXE
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --icon storyforge_transparent.ico
          --add-data "database.py;."
          --add-data "docx_export.py;."
          --add-data "font_studio.py;."
          --add-data "storage_client.py;."
          --add-data "__init__.py;."
          --add-data "run.bat;."
          --add-data "py;py"
          --add-data "storyforge_transparent.ico;."
          --hidden-import sqlite3
          --hidden-import _sqlite3
          --hidden-import docx
          --hidden-import docx_export
          --hidden-import lxml
          --hidden-import lxml.etree
          --hidden-import lxml._elementpath
          --hidden-import font_studio
          --hidden-import storage_client
          --hidden-import PIL
          --hidden-import PIL.Image
          --hidden-import PIL.ImageDraw
          --hidden-import PIL.ImageFont
          --hidden-import fontTools
          --hidden-import fontTools.ttLib
          --hidden-import fontTools.pens.t2Pen
          --hidden-import spellchecker
          --hidden-import pyspellchecker
          --hidden-import collections
          --hidden-import difflib
          --hidden-import zipfile
          --hidden-import uuid
          --hidden-import random
          --hidden-import math
          --hidden-import threading
          --hidden-import urllib.request
          --hidden-import urllib.error
          --hidden-import urllib.parse
          --hidden-import PyQt6.QtCore
          --hidden-import PyQt6.QtGui
          --hidden-import PyQt6.QtWidgets
          --hidden-import PyQt6.sip
          storyforge.py

      - uses: actions/upload-artifact@v4
        with:
          name: StoryForge-exe
          path: dist/storyforge.exe
