name: Build and Release macOS DMG

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pyinstaller \
            python-docx \
            lxml \
            fonttools \
            pillow \
            pyspellchecker \
            PyQt6 \
            PyQt6-Qt6 \
            PyQt6-sip

      - name: Verify PyQt6 installation
        shell: bash
        run: |
          python -c "from PyQt6 import QtCore, QtGui, QtWidgets; print('PyQt6 imports successfully')"
          python -m PyInstaller --version

      - name: Build on macOS
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name StoryForge \
            --collect-all PyQt6 \
            --add-data "database.py:." \
            --add-data "docx_export.py:." \
            --add-data "font_studio.py:." \
            --add-data "storage_client.py:." \
            --hidden-import sqlite3 \
            --hidden-import docx \
            --hidden-import lxml \
            --hidden-import fontTools \
            --hidden-import PIL \
            --hidden-import spellchecker \
            --hidden-import PyQt6 \
            --hidden-import PyQt6.QtCore \
            --hidden-import PyQt6.QtGui \
            --hidden-import PyQt6.QtWidgets \
            storyforge.py

      - name: Verify macOS application
        shell: bash
        run: |
          if [ ! -d "dist/StoryForge.app" ]; then
            echo "ERROR: dist/StoryForge.app was not created"
            exit 1
          fi
          ls -la dist

      - name: Create macOS DMG
        shell: bash
        run: |
          hdiutil create \
            -volname StoryForge \
            -srcfolder dist/StoryForge.app \
            -ov \
            -format UDZO \
            dist/StoryForge.dmg

      - name: Verify DMG
        shell: bash
        run: |
          test -f "dist/StoryForge.dmg" || {
            echo "ERROR: StoryForge.dmg was not created"
            exit 1
          }

      - name: Upload macOS DMG to StoryForge Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          repository: sut0005-cpu/storyforgeapp
          tag_name: installer
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/StoryForge.dmg
