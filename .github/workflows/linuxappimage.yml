name: Build StoryForge Flatpak Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Flatpak Installer Bundle
        run: |
          dbus-run-session -- flatpak-builder --force-clean --disable-rofiles-fuse --repo=repo build-dir storyforge.yml
          flatpak build-bundle repo StoryForge-Installer.flatpak io.github.sut0005_cpu.storyforge



      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoryForge-Installer-x86_64
          path: StoryForge-Installer.flatpak

      - name: Attach Installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: StoryForge-Installer.flatpak

