app-id: io.github.sut0005_cpu.storyforge
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: storyforge

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --filesystem=home

modules:
  - name: python-deps
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} python-docx pillow

  - name: storyforge
    buildsystem: simple
    build-commands:
      - install -d /app/bin
      - cp *.py /app/bin/
      - cp storyforge_transparent.ico /app/bin/

      - |
        cat << 'EOF' > /app/bin/storyforge
        #!/bin/sh
        exec python3 /app/bin/storyforge.py "$@"
        EOF
      - chmod +x /app/bin/storyforge

      - install -d /app/share/icons/hicolor/256x256/apps
      - python3 -c "from PIL import Image; Image.open('storyforge_transparent.ico').resize((256, 256)).save('/app/share/icons/hicolor/256x256/apps/io.github.sut0005_cpu.storyforge.png')"
      - install -Dm644 storyforge.desktop /app/share/applications/io.github.sut0005_cpu.storyforge.desktop
    sources:
      - type: dir
        path: .
